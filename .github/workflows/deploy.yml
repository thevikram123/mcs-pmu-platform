name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-deployed Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Note: the xlsx dependency resolves to the official SheetJS CDN tarball
      # (the npm-registry build carries unfixed advisories), so this step needs
      # network access to cdn.sheetjs.com.
      - run: npm ci

      # The fidelity suite asserts the engine still reproduces the source
      # workbooks to the rupee. A failure here must block the deploy — shipping
      # a model that misstates GVPR's numbers is worse than shipping nothing.
      - name: Verify model against source workbooks
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
